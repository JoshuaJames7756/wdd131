<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review Confirmation">
    <meta name="author" content="Joshua James">

    <title>Review Submitted</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/review.js" defer></script>
</head>
<body>

    <header>
        <h1>Thank You!</h1>
    </header>

    <main class="confirmation">

        <div class="success-card">

            <div class="checkmark">✓</div>

            <h2>Review Submitted!</h2>

            <p>
                Thank you for sharing your feedback.
            </p>

            <div class="counter-box">
                <span>Total Reviews Submitted</span>
                <strong id="reviewCount">0</strong>
            </div>

            <a href="form.html" class="back-link">
                Submit Another Review
            </a>

        </div>

    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Joshua James | Bolivia</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>

</body>
</html>
