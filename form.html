<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description"
        content="Submit a product review by selecting a product, rating its features, and sharing your feedback through this responsive review form.">

    <meta name="author" content="Joshua James">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

    <form method="get" action="review.html">

        <div class="form-group">
            <label for="product">Product Name *</label>

            <select id="product" name="product" required>
                <option value="" disabled selected>
                    Select a Product ...
                </option>
            </select>
        </div>

        <div class="form-group">
            <label>Overall Rating *</label>

            <div class="rating">

                <div class="rating-item">
                    <input type="radio" id="star1" name="rating" value="1" required>
                    <label for="star1">☆</label>
                </div>

                <div class="rating-item">
                    <input type="radio" id="star2" name="rating" value="2" required>
                    <label for="star2">☆☆</label>
                </div>

                <div class="rating-item">
                    <input type="radio" id="star3" name="rating" value="3" required>
                    <label for="star3">☆☆☆</label>
                </div>

                <div class="rating-item">
                    <input type="radio" id="star4" name="rating" value="4" required>
                    <label for="star4">☆☆☆☆</label>
                </div>

                <div class="rating-item">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">☆☆☆☆☆</label>
                </div>

            </div>
        </div>

        <div class="form-group">
            <label for="installDate">Date of Installation *</label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required>
        </div>

        <div class="form-group">

            <label>Useful Features (Check all that apply)</label>

            <div class="checkbox-group">

                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability">

                    <label for="durability">
                        Durability
                    </label>
                </div>

                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="ease"
                        name="features"
                        value="Ease of Use">

                    <label for="ease">
                        Ease of Use
                    </label>
                </div>

                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance">

                    <label for="performance">
                        Performance
                    </label>
                </div>

                <div class="checkbox-item">
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design">

                    <label for="design">
                        Design
                    </label>
                </div>

            </div>

        </div>

        <div class="form-group">

            <label for="review">
                Written Review
            </label>

            <textarea
                id="review"
                name="review"
                rows="5"></textarea>

        </div>

        <div class="form-group">

            <label for="username">
                Your Name
            </label>

            <input
                type="text"
                id="username"
                name="username">

        </div>

        <input
            type="submit"
            value="Post Review"
            class="submit-btn">

    </form>

</main>

<footer>
    <p>&copy; <span id="year"></span> | Joshua James | Bolivia</p>

    <p>
        Last Modification:
        <span id="lastModified"></span>
    </p>
</footer>

</body>
</html>
